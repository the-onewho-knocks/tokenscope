[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenscope"
version = "0.1.0"
description = "Count LLM tokens across a repository and roll them up per folder/module."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
accurate = ["tiktoken>=0.7"]
dev = ["pytest>=7"]

[project.scripts]
tokenscope = "tokenscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
